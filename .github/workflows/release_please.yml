# Opens one release PR per package (cocoon, cocoon_generator) from the
# conventional commits on master: it bumps pubspec.yaml and writes the
# CHANGELOG entry. Merging the PR tags cocoon-vX.Y.Z / cocoon_generator-vX.Y.Z,
# and that tag push runs the matching publish_*.yml.
#
# RELEASE_PLEASE_TOKEN must be a fine-grained PAT (contents + pull requests:
# write on this repo): tags pushed with the default GITHUB_TOKEN never start
# other workflows, so the publish workflows would not fire.
# Only cocoon* is released this way; the other Butterfly packages are not
# in release-please-config.json until they ship.
name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
