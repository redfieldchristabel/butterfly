name: cocoon_example
resolution: workspace
publish_to: none
description: "A small finance-style sample for Cocoon: annotated models, a committed schema lock and end-to-end tests over a real SQLite database."
version: 0.0.1
homepage: https://github.com/redfieldchristabel/butterfly

environment:
  sdk: ^3.11.0

dependencies:
  cocoon: ^0.1.0

dev_dependencies:
  build_runner: ^2.4.13
  cocoon_generator: ^0.1.0
  lints: ^6.0.0
  sqlite3: ^3.5.2
  test: ^1.24.0
