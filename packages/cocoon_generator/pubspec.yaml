name: cocoon_generator
resolution: workspace
description: "Code generator for Cocoon: build_runner codegen for @Collection models (adapters, typed query handles and canonical wire codecs)."
version: 0.0.1
homepage: https://github.com/redfieldchristabel/butterfly

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^12.1.0
  build: ^4.0.0
  cocoon: ^0.0.1
  source_gen: ^4.2.0

dev_dependencies:
  # Pinned: 3.5.17+ pulls newer build_runner versions than this workspace
  # locks, and 3.5.23 needs build ^5.
  build_test: 3.5.16
  glob: ^2.1.2
  lints: ^6.0.0
  package_config: ^2.1.0
  test: ^1.24.0
