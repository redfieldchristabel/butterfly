name: cocoon_generator
resolution: workspace
description: "Code generator for Cocoon: build_runner codegen for @Collection models (adapters, typed query handles and canonical wire codecs)."
version: 0.1.0
repository: https://github.com/redfieldchristabel/butterfly/tree/master/packages/cocoon_generator
issue_tracker: https://github.com/redfieldchristabel/butterfly/issues
topics:
  - database
  - sqlite
  - codegen
  - build-runner

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.0.0
  build: ^4.0.0
  cocoon: ^0.1.0
  glob: ^2.1.2
  source_gen: ^4.2.0
  yaml: ^3.1.0

dev_dependencies:
  # build_test pins build_runner exactly per release (3.5.21 -> 2.16.2, what
  # this workspace locks; 3.5.22+ need 2.17 and build ^5).
  build_test: 3.5.21
  lints: ^6.0.0
  package_config: ^2.1.0
  test: ^1.24.0
