name: cocoon
resolution: workspace
description: "A typed document database for Flutter & Dart: Firestore-style collections, protobuf-packed docs and real indexes on disk. SQLite under the hood, zero SQL."
version: 0.1.3
repository: https://github.com/redfieldchristabel/butterfly/tree/master/packages/cocoon
issue_tracker: https://github.com/redfieldchristabel/butterfly/issues
documentation: https://docs.page/redfieldchristabel/butterfly/libraries/cocoon
screenshots:
  - description: 'Kepo, the Cocoon mascot.'
    path: doc/kepo.png
topics:
  - database
  - nosql
  - firestore
  - offline-first
  - sqlite

environment:
  sdk: ^3.11.0

dependencies:
  meta: ^1.16.0
  sqlite3: ^3.5.2
  sqlite_async: ^0.14.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
